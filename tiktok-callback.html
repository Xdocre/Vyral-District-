<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Vyral District · TikTok Connect</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <main class="wrap" style="padding:80px 0;max-width:640px">
    <a href="index.html" class="vd-logo">VYRAL<b>DISTRICT</b></a>
    <h2 style="margin-top:32px">TikTok connected</h2>
    <p class="sub" id="msg">Copy this code and run the second step of <code>autopost/tiktok-auth.mjs</code>. It expires in a few minutes.</p>
    <pre id="code" style="white-space:pre-wrap;word-break:break-all;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px"></pre>
    <button class="btn" id="copy">Copy code</button>
  </main>
  <script>
    const p = new URLSearchParams(location.search);
    const code = p.get("code");
    document.getElementById("code").textContent = code || (p.get("error_description") || p.get("error") || "No code in the link.");
    if (!code) document.getElementById("msg").textContent = "TikTok didn't return a code.";
    document.getElementById("copy").onclick = () => navigator.clipboard.writeText(code || "");
  </script>
</body>
</html>
