name: Vyral District daily scripts

# Every morning, Claude writes 3 new TikTok scripts (tip, tip, pitch) in the
# Vyral District voice and adds them to data/videos.json. The TikTok workflow
# renders each one in 3D with voiceover right before it posts it.
on:
  schedule:
    - cron: "17 9 * * *" # ~4:17am Eastern
  workflow_dispatch:
    inputs:
      count:
        description: "How many scripts to write"
        required: false
        default: "3"

permissions:
  contents: write

concurrency: daily-content

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=dev
      - name: Write today's scripts with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node videos/generate.mjs --count "${{ github.event.inputs.count || '3' }}"
      - name: Commit
        run: |
          git config user.name "vyral-district-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || (git commit -m "content: daily scripts $(date -u +%F)" && git pull --rebase && git push)
