name: Vyral District TikTok posts

# Peak TikTok engagement windows for a US audience (Eastern Time). Each run
# starts ~10 min early because it renders the 3D video before posting:
#   ~7:45am (morning scroll) · ~12:15pm (lunch) · ~7:40pm (prime time)
# Cron is UTC and matches Eastern *Standard* Time (Nov–Mar). During daylight
# time (Mar–Nov) subtract 1 hour from each UTC hour to keep the same local time.
on:
  schedule:
    - cron: "34 12 * * *"
    - cron: "3 17 * * *"
    - cron: "28 0 * * *"
  workflow_dispatch:
    inputs:
      video_id:
        description: "Post a specific video (e.g. pv-03). Blank = next in line."
        required: false

permissions:
  contents: write

concurrency: tiktok-post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: videos/requirements.txt

      - name: Pick next video
        id: pick
        env:
          VIDEO_ID: ${{ github.event.inputs.video_id }}
          ALLOW_REPEATS: ${{ vars.TIKTOK_ALLOW_REPEATS }}
        run: |
          npm ci
          ID=$(node autopost/tiktok.mjs --next | tail -1)
          if [[ ! "$ID" =~ ^[a-z]+-[0-9-]+$ ]]; then echo "Nothing to post: $ID"; echo "id=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          [ -f "videos/out/$ID-9x16.mp4" ] && echo "rendered=true" >> "$GITHUB_OUTPUT" || echo "rendered=false" >> "$GITHUB_OUTPUT"
          echo "Next: $ID"

      - name: Cache voice model
        if: steps.pick.outputs.id != '' && steps.pick.outputs.rendered == 'false'
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-v1.0-int8
      - name: Render 3D video with voiceover
        if: steps.pick.outputs.id != '' && steps.pick.outputs.rendered == 'false'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter >/dev/null || sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r videos/requirements.txt
          mkdir -p ~/kokoro
          [ -f ~/kokoro/kokoro.onnx ] || curl -sSL -o ~/kokoro/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f ~/kokoro/voices.bin ] || curl -sSL -o ~/kokoro/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          npx playwright install --with-deps chromium
          python videos/audio.py --model ~/kokoro/kokoro.onnx --voices ~/kokoro/voices.bin --only "${{ steps.pick.outputs.id }}"
          node videos/render.mjs --only "${{ steps.pick.outputs.id }}" --format 9x16

      - name: Post to TikTok
        if: steps.pick.outputs.id != ''
        env:
          POST_LIVE: ${{ vars.POST_LIVE }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          VIDEO_ID: ${{ steps.pick.outputs.id }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: node autopost/tiktok.mjs

      - name: Keep a copy of the video
        if: steps.pick.outputs.id != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pick.outputs.id }}
          path: videos/out/${{ steps.pick.outputs.id }}-9x16.*
          retention-days: 30

      - name: Save post history
        if: steps.pick.outputs.id != ''
        run: |
          git config user.name "vyral-district-bot"
          git config user.email "actions@users.noreply.github.com"
          git add autopost/tiktok-state.json
          git diff --cached --quiet || (git commit -m "tiktok: posted ${{ steps.pick.outputs.id }}" && git pull --rebase && git push)
