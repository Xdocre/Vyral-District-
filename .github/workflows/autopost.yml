name: Vyral District auto-post

on:
  schedule:
    # 3 posts a day: 9am, 1pm, 7pm US Eastern (UTC times below)
    - cron: "7 14 * * *"
    - cron: "7 18 * * *"
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      ad_id:
        description: "Post a specific ad (e.g. vd-003). Leave blank for the next one."
        required: false

permissions:
  contents: write

concurrency: autopost

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish next ad
        env:
          # Set the repository variable POST_LIVE=true to go live. Until then this is a dry run.
          POST_LIVE: ${{ vars.POST_LIVE }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          AD_ID: ${{ github.event.inputs.ad_id }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node autopost/post.mjs
      - name: Save post history
        run: |
          git config user.name "vyral-district-bot"
          git config user.email "actions@users.noreply.github.com"
          git add autopost/state.json
          git diff --cached --quiet || (git commit -m "autopost: record published ad" && git push)
